services:
  - type: web
    name: vastuai-app
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: VASTUAI_DATA_DIR
        value: /var/data
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5
      - key: OPENAI_VISION_MODEL
        value: gpt-5
    disk:
      name: vastuai-data
      mountPath: /var/data
      sizeGB: 1
